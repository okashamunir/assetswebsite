<!DOCTYPE html>
<html>
<head>
  <title>Canvas-generated Image</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      margin: 0 auto;
      background: #fff;
    }
  </style>
</head>
<body>
  <canvas id="imageCanvas"></canvas>

  <script>
    // Get the canvas element and its context
    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d');
    
    // Set canvas size to match window
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drawImage();
    }
    
    // Draw the image content
    function drawImage() {
      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Get parameters from URL
      const urlParams = new URLSearchParams(window.location.search);
      const type = urlParams.get('type') || 'smash';
      const color = urlParams.get('color') || '#ff5252';
      const text = urlParams.get('text') || 'Smash Deal Image';
      
      if (type === 'deal1') {
        // Draw a blue background with text for deal1
        ctx.fillStyle = '#2196f3';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Add text
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 32px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Deal 1 Image', canvas.width / 2, canvas.height / 2);
      } else {
        // Draw background for smash deal
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Draw a simple graphic
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        
        // Draw a star burst
        ctx.fillStyle = '#fff';
        const rays = 12;
        const outerRadius = Math.min(canvas.width, canvas.height) * 0.3;
        const innerRadius = outerRadius * 0.4;
        
        ctx.beginPath();
        for (let i = 0; i < rays * 2; i++) {
          const radius = i % 2 === 0 ? outerRadius : innerRadius;
          const angle = (Math.PI * 2 * i) / (rays * 2);
          const x = centerX + radius * Math.cos(angle);
          const y = centerY + radius * Math.sin(angle);
          
          if (i === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        }
        ctx.closePath();
        ctx.fill();
        
        // Add text
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 32px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, centerX, centerY);
      }
      
      // Add instructions
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
      ctx.fillStyle = '#fff';
      ctx.font = '14px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Right-click to save this image | Parameters: ?type=smash&color=#ff5252&text=Custom Text', canvas.width / 2, canvas.height - 20);
    }
    
    // Handle window resize
    window.addEventListener('resize', resizeCanvas);
    
    // Initial setup
    resizeCanvas();
  </script>
</body>
</html>
