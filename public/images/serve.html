<!DOCTYPE html>
<html>
<head>
  <title>Image Server</title>
  <script>
    // This script loads the image directly without any HTML wrapper
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const img = urlParams.get('img') || 'deal1.jpeg';
      
      // Replace the entire document with just the image
      document.open();
      document.write('<img src="' + img + '" style="max-width:100%;height:auto;display:block;margin:0;" />');
      document.close();
    }
  </script>
  <style>
    body, html { margin: 0; padding: 0; }
  </style>
</head>
<body>
  <!-- Content will be replaced by the script -->
  Loading image...
</body>
</html>
